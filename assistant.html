<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark" />
  <title>AI Placement Assistant</title>
  <style>
    :root {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #f5f7fa;
      background: #101214;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #101214; }
    body { padding: 14px; }

    .shell {
      width: 100%;
      min-height: 620px;
      max-height: 760px;
      display: flex;
      flex-direction: column;
      background: #15181b;
      border: 1px solid #2a2f35;
      border-radius: 14px;
      overflow: hidden;
    }

    header {
      padding: 14px 16px 12px;
      border-bottom: 1px solid #272c31;
      background: #171a1e;
    }

    .title { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #5ee38f; box-shadow: 0 0 12px rgba(94, 227, 143, .45); }
    .subtitle { margin-top: 4px; color: #929aa4; font-size: 11px; line-height: 1.45; }

    .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px 0; }
    .chip {
      appearance: none;
      border: 1px solid #343a41;
      background: #1c2025;
      color: #cbd2d9;
      border-radius: 999px;
      padding: 6px 9px;
      font-size: 10px;
      cursor: pointer;
    }
    .chip:hover { background: #242930; border-color: #49515a; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 14px 12px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      scroll-behavior: smooth;
    }

    .message {
      max-width: 88%;
      padding: 9px 11px;
      border-radius: 11px;
      font-size: 12px;
      line-height: 1.55;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .assistant { align-self: flex-start; background: #1d2227; border: 1px solid #2d343b; color: #e8ebef; }
    .user { align-self: flex-end; background: #21442f; border: 1px solid #2f6844; color: #edf8f0; }
    .error { color: #ffb7b7; border-color: #633939; background: #2a1c1c; }
    .thinking { color: #9da5ad; font-style: italic; }

    .composer {
      padding: 10px;
      border-top: 1px solid #272c31;
      background: #14171a;
    }

    textarea {
      width: 100%;
      resize: none;
      min-height: 68px;
      max-height: 160px;
      border: 1px solid #343a41;
      border-radius: 10px;
      background: #0f1113;
      color: #f4f6f8;
      padding: 10px;
      font: inherit;
      font-size: 12px;
      outline: none;
    }
    textarea:focus { border-color: #55705f; }

    .actions { margin-top: 7px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .hint { color: #737c85; font-size: 9px; }
    .buttons { display: flex; gap: 6px; }
    button.action {
      border: 0;
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 10px;
      font-weight: 650;
      cursor: pointer;
    }
    #clear { background: #252a2f; color: #c6ccd2; }
    #send { background: #e9f4ed; color: #102316; }
    #send:disabled { opacity: .45; cursor: not-allowed; }

    code {
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      background: #0d0f11;
      border: 1px solid #2c3136;
      border-radius: 4px;
      padding: 1px 4px;
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="title"><span class="dot"></span> AI Placement Assistant</div>
      <div class="subtitle">DSA · Aptitude · Core CS · System Design · Resume · Interviews · Placement strategy</div>
    </header>

    <div class="chips">
      <button class="chip" data-prompt="Explain this DSA concept step by step: ">Explain DSA</button>
      <button class="chip" data-prompt="Interview me on this Core CS topic: ">Interview Me</button>
      <button class="chip" data-prompt="Help me prepare for an online assessment covering: ">OA Prep</button>
      <button class="chip" data-prompt="Brainstorm a strong project around: ">Project Brainstorm</button>
      <button class="chip" data-prompt="Explain this system design concept for an interview: ">System Design</button>
    </div>

    <section id="messages" aria-live="polite">
      <div class="message assistant">Ask me anything about placement preparation. I’ll keep answers compact and interview-focused.</div>
    </section>

    <form class="composer" id="form">
      <textarea id="input" placeholder="Ask about DSA, OS, DBMS, CN, system design, resumes, projects, interviews…"></textarea>
      <div class="actions">
        <div class="hint">Enter to send · Shift+Enter for newline</div>
        <div class="buttons">
          <button class="action" type="button" id="clear">Clear</button>
          <button class="action" type="submit" id="send">Send</button>
        </div>
      </div>
    </form>
  </main>

  <script>
    const form = document.getElementById('form');
    const input = document.getElementById('input');
    const messagesEl = document.getElementById('messages');
    const send = document.getElementById('send');
    const clear = document.getElementById('clear');
    const chips = [...document.querySelectorAll('.chip')];

    let messages = [];

    function addMessage(role, text, extra = '') {
      const el = document.createElement('div');
      el.className = `message ${role} ${extra}`.trim();
      el.textContent = text;
      messagesEl.appendChild(el);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return el;
    }

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        input.value = chip.dataset.prompt || '';
        input.focus();
      });
    });

    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' && !event.shiftKey) {
        event.preventDefault();
        form.requestSubmit();
      }
    });

    clear.addEventListener('click', () => {
      messages = [];
      messagesEl.innerHTML = '';
      addMessage('assistant', 'Conversation cleared. What are you working on?');
      input.focus();
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;

      addMessage('user', text);
      messages.push({ role: 'user', content: text });
      input.value = '';
      send.disabled = true;
      const thinking = addMessage('assistant', 'Thinking…', 'thinking');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages }),
        });
        const data = await response.json();
        thinking.remove();

        if (!response.ok) throw new Error(data?.error || 'Request failed');
        addMessage('assistant', data.text);
        messages.push({ role: 'assistant', content: data.text });
      } catch (error) {
        thinking.remove();
        addMessage('assistant', error.message || 'Unable to reach the assistant.', 'error');
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
</html>
